<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" style="background:#FAF8F6;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1B2A4A"/>
    </marker>
    <marker id="arrowMany" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C4A882"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2a4068"/>
    </linearGradient>
    <linearGradient id="cardUser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E2DE"/>
      <stop offset="100%" stop-color="#faf5f3"/>
    </linearGradient>
    <linearGradient id="cardJob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F0FE"/>
      <stop offset="100%" stop-color="#f0f5ff"/>
    </linearGradient>
    <linearGradient id="cardApp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F8E8"/>
      <stop offset="100%" stop-color="#f0faf0"/>
    </linearGradient>
    <linearGradient id="cardNotif" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFFDE7"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="1000" height="56" fill="url(#headerGrad)" rx="0"/>
  <text x="500" y="36" text-anchor="middle" fill="#C4A882" font-size="20" font-weight="bold">Nexova — Database Schema (ER Diagram)</text>

  <!-- Legend -->
  <rect x="30" y="68" width="120" height="18" rx="4" fill="#1B2A4A"/>
  <text x="34" y="82" fill="#fff" font-size="11" font-weight="600">PK = Primary Key</text>
  <rect x="170" y="68" width="130" height="18" rx="4" fill="#C4A882"/>
  <text x="174" y="82" fill="#fff" font-size="11" font-weight="600">FK = Foreign Key</text>

  <!-- ===== USER TABLE ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="100" width="270" height="208" rx="8" fill="url(#cardUser)" stroke="#1B2A4A" stroke-width="1.5"/>
    <!-- Header -->
    <rect x="30" y="100" width="270" height="32" rx="8" fill="#1B2A4A"/>
    <rect x="30" y="124" width="270" height="8" fill="#1B2A4A"/>
    <text x="165" y="122" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">USER</text>
    <!-- Fields -->
    <text x="40" y="150" fill="#1B2A4A" font-size="12" font-weight="bold">_id</text>
    <text x="100" y="150" fill="#888" font-size="11">ObjectId</text>
    <text x="190" y="150" fill="#1B2A4A" font-size="11">PK</text>
    <line x1="40" y1="156" x2="290" y2="156" stroke="rgba(27,42,74,0.08)"/>

    <text x="40" y="170" fill="#1B2A4A" font-size="12" font-weight="bold">name</text>
    <text x="100" y="170" fill="#888" font-size="11">String [required]</text>
    <line x1="40" y1="176" x2="290" y2="176" stroke="rgba(27,42,74,0.08)"/>

    <text x="40" y="190" fill="#1B2A4A" font-size="12" font-weight="bold">email</text>
    <text x="100" y="190" fill="#888" font-size="11">String [unique]</text>
    <text x="190" y="190" fill="#C4A882" font-size="11">FK</text>
    <line x1="40" y1="196" x2="290" y2="196" stroke="rgba(27,42,74,0.08)"/>

    <text x="40" y="210" fill="#1B2A4A" font-size="12" font-weight="bold">password</text>
    <text x="100" y="210" fill="#888" font-size="11">String [hashed]</text>
    <line x1="40" y1="216" x2="290" y2="216" stroke="rgba(27,42,74,0.08)"/>

    <text x="40" y="230" fill="#1B2A4A" font-size="12" font-weight="bold">phone</text>
    <text x="100" y="230" fill="#888" font-size="11">String</text>
    <line x1="40" y1="236" x2="290" y2="236" stroke="rgba(27,42,74,0.08)"/>

    <text x="40" y="250" fill="#1B2A4A" font-size="12" font-weight="bold">role</text>
    <text x="100" y="250" fill="#888" font-size="11">"jobseeker | recruiter"</text>
    <line x1="40" y1="256" x2="290" y2="256" stroke="rgba(27,42,74,0.08)"/>

    <text x="40" y="270" fill="#1B2A4A" font-size="12" font-weight="bold">company</text>
    <text x="100" y="270" fill="#888" font-size="11">String [optional]</text>
    <line x1="40" y1="276" x2="290" y2="276" stroke="rgba(27,42,74,0.08)"/>

    <text x="40" y="290" fill="#1B2A4A" font-size="12" font-weight="bold">location</text>
    <text x="100" y="290" fill="#888" font-size="11">String</text>
    <!-- Continue indicator -->
    <rect x="270" y="292" width="22" height="12" rx="3" fill="rgba(27,42,74,0.1)"/>
    <text x="281" y="301" text-anchor="middle" fill="#1B2A4A" font-size="9">+4</text>
  </g>

  <!-- ===== JOB TABLE ===== -->
  <g filter="url(#shadow)">
    <rect x="360" y="100" width="270" height="240" rx="8" fill="url(#cardJob)" stroke="#1B2A4A" stroke-width="1.5"/>
    <rect x="360" y="100" width="270" height="32" rx="8" fill="#1B2A4A"/>
    <rect x="360" y="124" width="270" height="8" fill="#1B2A4A"/>
    <text x="495" y="122" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">JOB</text>

    <text x="370" y="150" fill="#1B2A4A" font-size="12" font-weight="bold">_id</text>
    <text x="430" y="150" fill="#888" font-size="11">ObjectId</text>
    <text x="520" y="150" fill="#1B2A4A" font-size="11">PK</text>
    <line x1="370" y1="156" x2="620" y2="156" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="170" fill="#1B2A4A" font-size="12" font-weight="bold">title</text>
    <text x="430" y="170" fill="#888" font-size="11">String [required]</text>
    <line x1="370" y1="176" x2="620" y2="176" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="190" fill="#1B2A4A" font-size="12" font-weight="bold">location</text>
    <text x="430" y="190" fill="#888" font-size="11">String [required]</text>
    <line x1="370" y1="196" x2="620" y2="196" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="210" fill="#1B2A4A" font-size="12" font-weight="bold">type</text>
    <text x="430" y="210" fill="#888" font-size="11">Full-time|Part-time|...</text>
    <line x1="370" y1="216" x2="620" y2="216" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="230" fill="#1B2A4A" font-size="12" font-weight="bold">category</text>
    <text x="430" y="230" fill="#888" font-size="11">20 types [enum]</text>
    <line x1="370" y1="236" x2="620" y2="236" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="250" fill="#1B2A4A" font-size="12" font-weight="bold">description</text>
    <text x="430" y="250" fill="#888" font-size="11">String [required]</text>
    <line x1="370" y1="256" x2="620" y2="256" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="270" fill="#1B2A4A" font-size="12" font-weight="bold">postedBy</text>
    <text x="430" y="270" fill="#888" font-size="11">ObjectId</text>
    <text x="520" y="270" fill="#C4A882" font-size="11">FK → User</text>
    <line x1="370" y1="276" x2="620" y2="276" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="290" fill="#1B2A4A" font-size="12" font-weight="bold">status</text>
    <text x="430" y="290" fill="#888" font-size="11">"open | closed"</text>
    <line x1="370" y1="296" x2="620" y2="296" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="310" fill="#1B2A4A" font-size="12" font-weight="bold">salary</text>
    <text x="430" y="310" fill="#888" font-size="11">String</text>
    <line x1="370" y1="316" x2="620" y2="316" stroke="rgba(27,42,74,0.08)"/>

    <text x="370" y="330" fill="#1B2A4A" font-size="12" font-weight="bold">isActive</text>
    <text x="430" y="330" fill="#888" font-size="11">Boolean [default:true]</text>
  </g>

  <!-- ===== APPLICATION TABLE ===== -->
  <g filter="url(#shadow)">
    <rect x="690" y="100" width="280" height="208" rx="8" fill="url(#cardApp)" stroke="#1B2A4A" stroke-width="1.5"/>
    <rect x="690" y="100" width="280" height="32" rx="8" fill="#1B2A4A"/>
    <rect x="690" y="124" width="280" height="8" fill="#1B2A4A"/>
    <text x="830" y="122" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">APPLICATION</text>

    <text x="700" y="150" fill="#1B2A4A" font-size="12" font-weight="bold">_id</text>
    <text x="760" y="150" fill="#888" font-size="11">ObjectId</text>
    <text x="850" y="150" fill="#1B2A4A" font-size="11">PK</text>
    <line x1="700" y1="156" x2="960" y2="156" stroke="rgba(27,42,74,0.08)"/>

    <text x="700" y="170" fill="#1B2A4A" font-size="12" font-weight="bold">jobId</text>
    <text x="760" y="170" fill="#888" font-size="11">ObjectId</text>
    <text x="850" y="170" fill="#C4A882" font-size="11">FK → Job</text>
    <line x1="700" y1="176" x2="960" y2="176" stroke="rgba(27,42,74,0.08)"/>

    <text x="700" y="190" fill="#1B2A4A" font-size="12" font-weight="bold">applicantId</text>
    <text x="760" y="190" fill="#888" font-size="11">ObjectId</text>
    <text x="850" y="190" fill="#C4A882" font-size="11">FK → User</text>
    <line x1="700" y1="196" x2="960" y2="196" stroke="rgba(27,42,74,0.08)"/>

    <text x="700" y="210" fill="#1B2A4A" font-size="12" font-weight="bold">status</text>
    <text x="760" y="210" fill="#888" font-size="11">"pending|accepted|rejected"</text>
    <line x1="700" y1="216" x2="960" y2="216" stroke="rgba(27,42,74,0.08)"/>

    <text x="700" y="230" fill="#1B2A4A" font-size="12" font-weight="bold">coverLetter</text>
    <text x="760" y="230" fill="#888" font-size="11">String</text>
    <line x1="700" y1="236" x2="960" y2="236" stroke="rgba(27,42,74,0.08)"/>

    <text x="700" y="250" fill="#1B2A4A" font-size="12" font-weight="bold">appliedAt</text>
    <text x="760" y="250" fill="#888" font-size="11">Date [default: now]</text>
    <line x1="700" y1="256" x2="960" y2="256" stroke="rgba(27,42,74,0.08)"/>

    <rect x="700" y="264" width="140" height="18" rx="4" fill="rgba(196,168,130,0.15)"/>
    <text x="706" y="277" fill="#C4A882" font-size="11" font-weight="600">↑ unique(jobId + applicantId)</text>
  </g>

  <!-- ===== RELATIONSHIPS ===== -->

  <!-- User -> Job (one recruiter posts many jobs) -->
  <path d="M300,280 C320,280 340,280 360,280" stroke="#1B2A4A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="315" y="274" text-anchor="middle" fill="#1B2A4A" font-size="9" font-weight="bold">1</text>
  <text x="355" y="274" text-anchor="middle" fill="#1B2A4A" font-size="9" font-weight="bold">N</text>
  <rect x="295" y="285" width="70" height="16" rx="4" fill="#1B2A4A" opacity="0.85"/>
  <text x="330" y="297" text-anchor="middle" fill="#fff" font-size="9">posts</text>

  <!-- User -> Application (one jobseeker submits many apps) -->
  <path d="M165,308 C165,340 165,360 165,380 L165,450 C165,480 165,490 280,500" stroke="#1B2A4A" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="158" y="440" fill="#1B2A4A" font-size="9" font-weight="bold">1</text>
  <text x="270" y="503" fill="#1B2A4A" font-size="9" font-weight="bold">N</text>
  <rect x="175" y="445" width="80" height="16" rx="4" fill="#1B2A4A" opacity="0.85"/>
  <text x="215" y="457" text-anchor="middle" fill="#fff" font-size="9">submits</text>

  <!-- Job -> Application (one job receives many apps) -->
  <path d="M495,340 C495,370 495,390 495,420 L495,480 C495,510 495,520 690,510" stroke="#1B2A4A" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="488" y="415" fill="#1B2A4A" font-size="9" font-weight="bold">1</text>
  <text x="680" y="513" fill="#1B2A4A" font-size="9" font-weight="bold">N</text>
  <rect x="510" y="460" width="72" height="16" rx="4" fill="#1B2A4A" opacity="0.85"/>
  <text x="546" y="472" text-anchor="middle" fill="#fff" font-size="9">receives</text>

  <!-- ===== NOTIFICATION SERVICES (bottom) ===== -->
  <g filter="url(#shadow)">
    <rect x="100" y="540" width="800" height="120" rx="10" fill="url(#cardNotif)" stroke="#C4A882" stroke-width="1.5"/>
    <rect x="100" y="540" width="800" height="32" rx="10" fill="#C4A882"/>
    <rect x="100" y="564" width="800" height="8" fill="#C4A882"/>
    <text x="500" y="562" text-anchor="middle" fill="#1B2A4A" font-size="15" font-weight="bold">NOTIFICATION SERVICES (Triggers on Events)</text>

    <!-- Email -->
    <rect x="120" y="585" width="240" height="55" rx="6" fill="#fff" stroke="rgba(27,42,74,0.1)"/>
    <text x="240" y="605" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="bold">✉️ Email (Nodemailer)</text>
    <text x="240" y="622" text-anchor="middle" fill="#666" font-size="10">Welcome, OTP, Application</text>
    <text x="240" y="636" text-anchor="middle" fill="#666" font-size="10">Status Change</text>

    <!-- SMS -->
    <rect x="380" y="585" width="240" height="55" rx="6" fill="#fff" stroke="rgba(27,42,74,0.1)"/>
    <text x="500" y="605" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="bold">💬 SMS (Fast2SMS)</text>
    <text x="500" y="622" text-anchor="middle" fill="#666" font-size="10">OTP, Login Alert, Job Post</text>
    <text x="500" y="636" text-anchor="middle" fill="#666" font-size="10">Broadcast, Status Change</text>

    <!-- WhatsApp -->
    <rect x="640" y="585" width="240" height="55" rx="6" fill="#fff" stroke="rgba(27,42,74,0.1)"/>
    <text x="760" y="605" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="bold">📱 WhatsApp (Twilio)</text>
    <text x="760" y="622" text-anchor="middle" fill="#666" font-size="10">Welcome, Login Alert</text>
    <text x="760" y="636" text-anchor="middle" fill="#666" font-size="10">Application Updates</text>
  </g>
</svg>
